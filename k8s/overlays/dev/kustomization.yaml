# Dev overlay — now scoped to the shared/cross-cutting resources only
# (Ingress + External Secrets). The 8 services' replica counts, image
# tags/registries, and SPRING_DATASOURCE_URL patches moved to
# helm-values/{service}.yaml + helm-values/dev.yaml (E-16) — deploy those
# with `helm upgrade --install {service} helm/petclinic-service/ ...`, not
# through this kustomization. See docs/helm-guide.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: petclinic-dev

# certificate-arn and security-groups are Terraform-generated and change on
# every destroy/apply cycle (this project tears its environment down daily
# to control cost) — re-fetch with `terraform output -raw dns_certificate_arn`
# and `terraform output -raw alb_sg_id` in terraform/environments/dev after
# every re-apply. See k8s/base/ingress/ingress.yaml's comment for why the
# security-groups annotation matters (without it, the AWS Load Balancer
# Controller auto-creates its own SGs, which then can't pass health checks
# through the node SG, and orphan on manual ALB deletion).
patches:
  - target:
      kind: Ingress
      name: petclinic-ingress
    patch: |-
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
        value: arn:aws:acm:eu-central-1:771174261648:certificate/5cdde40c-ad93-43ec-a29c-7bfb25180703
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1security-groups
        value: sg-0585fdf170e2e202e
