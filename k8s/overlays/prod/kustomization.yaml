# Prod overlay — now scoped to the shared/cross-cutting resources only
# (Ingress + External Secrets). The 8 services' replica counts, HPAs,
# image tags/registries, and prod-specific settings moved to
# helm-values/{service}.yaml + helm-values/prod.yaml (E-16) — deploy those
# with `helm upgrade --install {service} helm/petclinic-service/ ...`, not
# through this kustomization. See docs/helm-guide.md. (hpa.yaml, which used
# to live in this directory, is deleted — the Helm chart's own
# templates/hpa.yaml now owns per-service HPA definitions.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: petclinic-prod

# The namespace transformer above handles metadata.namespace on the two
# ExternalSecrets automatically, but not their spec.data[].remoteRef.key
# values (arbitrary strings, not a namespace field) — those still read
# petclinic/dev/... from base without this patch.
patches:
  - target:
      kind: ExternalSecret
      name: rds-credentials
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: petclinic/prod/rds-credentials
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: petclinic/prod/rds-credentials
  - target:
      kind: ExternalSecret
      name: openai-api-key
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: petclinic/prod/openai-api-key
