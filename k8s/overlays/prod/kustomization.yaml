# Prod overlay (PETPLAT-46). Per technical-spec.md#kubernetes-overlays:
# namespace petclinic-prod, replicas per the prod table, SHA/release-tagged
# images from the petclinic-prod ECR repos.
#
# Resource requests/limits are NOT bumped here: PETPLAT-46's "increased
# where appropriate" isn't backed by any specific numbers in
# technical-spec.md's resource table (which is environment-agnostic) — left
# as a documented open decision for E-16 Helm values / real ops tuning,
# rather than inventing unspecified figures.
#
# These settings are also what E-16's helm-values/prod.yaml will encode.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - hpa.yaml

namespace: petclinic-prod

replicas:
  - name: config-server
    count: 2
  - name: discovery-server
    count: 2
  - name: customers-service
    count: 2
  - name: visits-service
    count: 2
  - name: vets-service
    count: 2
  - name: genai-service
    count: 1
  - name: api-gateway
    count: 2
  - name: admin-server
    count: 1

# Both name (petclinic-dev -> petclinic-prod repo) and tag change here,
# unlike the dev overlay. Tag is a literal placeholder — see dev's
# kustomization.yaml for why.
images:
  - name: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/config-server
    newName: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/config-server
    newTag: "{commit-sha}"
  - name: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/discovery-server
    newName: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/discovery-server
    newTag: "{commit-sha}"
  - name: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/customers-service
    newName: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/customers-service
    newTag: "{commit-sha}"
  - name: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/visits-service
    newName: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/visits-service
    newTag: "{commit-sha}"
  - name: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/vets-service
    newName: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/vets-service
    newTag: "{commit-sha}"
  - name: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/genai-service
    newName: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/genai-service
    newTag: "{commit-sha}"
  - name: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/api-gateway
    newName: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/api-gateway
    newTag: "{commit-sha}"
  - name: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/admin-server
    newName: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/admin-server
    newTag: "{commit-sha}"

# The namespace transformer above handles metadata.namespace on the two
# ExternalSecrets automatically, but not their spec.data[].remoteRef.key
# values (arbitrary strings, not a namespace field) — those still read
# petclinic/dev/... from base without this patch.
patches:
  - target:
      kind: ExternalSecret
      name: rds-credentials
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: petclinic/prod/rds-credentials
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: petclinic/prod/rds-credentials
  - target:
      kind: ExternalSecret
      name: openai-api-key
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: petclinic/prod/openai-api-key
