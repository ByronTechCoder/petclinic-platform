# HorizontalPodAutoscalers for prod (PETPLAT-47), per
# technical-spec.md#horizontal-pod-autoscaler-prod-only. Requires the
# Metrics Server installed on EKS (PETPLAT-72, not yet built).
#
# No metadata.namespace here — inherited from this overlay's
# `namespace: petclinic-prod` (kustomization.yaml), unlike the base
# manifests, which set it explicitly since they're also usable directly by
# the dev overlay.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
