# ArgoCD namespace (PETPLAT-112). Apply this before install.yaml — most of
# install.yaml's namespaced resources rely on `kubectl apply -n argocd` (or
# this namespace already existing) rather than setting metadata.namespace
# themselves; only 3 resources in that file do. See docs/technical-spec.md#argocd-installation.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/part-of: argocd
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
