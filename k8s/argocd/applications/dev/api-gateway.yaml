# api-gateway — dev Application CRD (PETPLAT-113). Auto-sync: any change to
# helm-values/api-gateway.yaml or helm-values/dev.yaml on main deploys automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ByronTechCoder/petclinic-platform.git
    targetRevision: main
    path: helm/petclinic-service
    helm:
      releaseName: api-gateway
      valueFiles:
        - ../../helm-values/api-gateway.yaml
        - ../../helm-values/dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
