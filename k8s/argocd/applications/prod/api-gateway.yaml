# api-gateway — prod Application CRD (PETPLAT-114). Manual sync only — no
# syncPolicy.automated block, so ArgoCD shows OutOfSync and waits for an
# explicit `argocd app sync api-gateway-prod` or a click in the ArgoCD UI.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ByronTechCoder/petclinic-platform.git
    targetRevision: main
    path: helm/petclinic-service
    helm:
      releaseName: api-gateway
      valueFiles:
        - ../../helm-values/api-gateway.yaml
        - ../../helm-values/prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
