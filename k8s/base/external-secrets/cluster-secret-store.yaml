# ClusterSecretStore for the External Secrets Operator (PETPLAT-34).
#
# Cluster-scoped by design and safe to reuse verbatim across dev and prod:
# each environment is a separate EKS cluster with its own OIDC provider, so
# "external-secrets/external-secrets-sa" in THIS cluster is always backed by
# THIS cluster's own IRSA role (petclinic-{env}-eso-role) — no per-env
# parameterization needed here.
#
# Applied by scripts/install-eso.sh after the operator is installed.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/name: aws-secrets-manager
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
