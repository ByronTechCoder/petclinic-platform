# ExternalSecret syncing RDS master credentials into K8s (PETPLAT-35).
#
# Base manifest (E-9 per-environment overlays don't exist yet): namespace
# defaults to petclinic-dev, and remoteRef.key is hardcoded to the dev
# secret name — the prod overlay patches both once k8s/overlays/prod/ is
# built (PETPLAT-46), matching k8s/base/ingress/ingress.yaml's approach.
#
# Requires: the petclinic-dev namespace to exist (PETPLAT-38, E-8 — not yet
# built) and the ClusterSecretStore in this file's sibling manifest applied.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: rds-credentials
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rds-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: petclinic/dev/rds-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: petclinic/dev/rds-credentials
        property: password
