# Base Kustomization for the shared/cross-cutting resources only: the
# Ingress (E-6) and External Secrets (E-7) resources. Consumed by
# k8s/overlays/{dev,prod}/, which each set namespace + the Ingress/
# ExternalSecret patches for their environment.
#
# The 8 per-service Deployment/Service/ConfigMap/ServiceAccount(+HPA/PDB)
# resources that used to live here (E-8/E-9) are NOT included anymore —
# they moved to the generic Helm chart (helm/petclinic-service/ +
# helm-values/, E-16; see docs/helm-guide.md). The k8s/base/{service}/
# directories themselves are left on disk as documented provenance (the
# Helm chart was built directly from them as its source of truth), but are
# no longer applied by this kustomization — applying both would double-
# manage the same Deployments via two different tools.
#
# namespaces.yaml is deliberately NOT listed here either: Kustomize's
# `namespace:` transformer (set by each overlay) renames Namespace-KIND
# resources' metadata.name to match its target, not just other resources'
# metadata.namespace. With both petclinic-dev and petclinic-prod defined in
# one file and pulled through either overlay, both end up renamed to the
# SAME target and collide ("namespace transformation produces ID
# conflict"). Apply namespaces.yaml on its own instead, once, outside either
# overlay: `kubectl apply -f k8s/base/namespaces.yaml`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingress/ingress.yaml
  - external-secrets/cluster-secret-store.yaml
  - external-secrets/rds-credentials.yaml
  - external-secrets/openai-api-key.yaml
