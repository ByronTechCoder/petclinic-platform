# Karpenter NodePool and EC2NodeClass for dev (PETPLAT-73). Dev runs on Graviton
# free-trial instances, so capacity is on-demand only. nodepool-spot-dev.yaml is
# the Spot override for after the free trial ends; apply it explicitly, do not merge.
#
# Requires the Karpenter CRDs (installed by the Helm chart in karpenter-install.yaml)
# and the discovery tags karpenter.sh/discovery=petclinic-dev on the public subnets
# and node security group (set in terraform/modules/vpc).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t4g.small", "t4g.medium"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 720h
  limits:
    cpu: "8"
    memory: 32Gi
  disruption:
    # WhenUnderutilized is not a valid value in Karpenter v1; WhenEmptyOrUnderutilized
    # is the equivalent consolidation policy.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  instanceProfile: petclinic-dev-karpenter-node-profile
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: petclinic-dev
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: petclinic-dev
