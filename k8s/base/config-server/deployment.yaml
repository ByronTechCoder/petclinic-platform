# Config Server (PETPLAT-39) — must be healthy before anything else starts
# (technical-spec.md#service-inventory: startup order 1st). No init
# containers: it's the thing every other service's init container waits on.
#
# Image is a placeholder (account/env baked in, tag literally "placeholder")
# until PETPLAT-85 pushes a real image — the dev overlay's `images:`
# transformer sets the real tag, the prod overlay also swaps petclinic-dev
# for petclinic-prod in the repository path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: config-server
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: config-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-server
        app.kubernetes.io/part-of: petclinic
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: config-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: config-server
          image: 771174261648.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/config-server:placeholder
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8888
          envFrom:
            - configMapRef:
                name: config-server-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
