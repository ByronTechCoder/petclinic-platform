# Prometheus (PETPLAT-55), managed by prometheus-operator. Scrapes exactly the
# five services with micrometer-registry-prometheus on their classpath.
# Config-server, discovery-server, and admin-server have no /actuator/prometheus
# endpoint and are deliberately not scraped (they would return 404).
#
# The Prometheus CR picks up PrometheusRule objects labelled
# app.kubernetes.io/part-of=petclinic (alerting-rules.yaml) and sends alerts to
# Alertmanager. The operator creates the StatefulSet; the `prometheus` Service
# keeps the http://prometheus:9090 name that Grafana's datasource uses.
# Targets point at petclinic-dev — prod needs its own scrape config later.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-petclinic
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-scrape-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: backend
stringData:
  prometheus-additional.yaml: "- job_name: api-gateway\n  metrics_path: /actuator/prometheus\n  scrape_interval: 15s\n  static_configs:\n    - targets: [\"api-gateway.petclinic-dev:8080\"]\n- job_name: customers-service\n  metrics_path: /actuator/prometheus\n  scrape_interval: 15s\n  static_configs:\n    - targets: [\"customers-service.petclinic-dev:8081\"]\n- job_name: visits-service\n  metrics_path: /actuator/prometheus\n  scrape_interval: 15s\n  static_configs:\n    - targets: [\"visits-service.petclinic-dev:8082\"]\n- job_name: vets-service\n  metrics_path: /actuator/prometheus\n  scrape_interval: 15s\n  static_configs:\n    - targets: [\"vets-service.petclinic-dev:8083\"]\n- job_name: genai-service\n  metrics_path: /actuator/prometheus\n  scrape_interval: 15s\n  static_configs:\n    - targets: [\"genai-service.petclinic-dev:8084\"]\n"
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: petclinic
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: backend
spec:
  version: v2.55.1
  replicas: 1
  serviceAccountName: prometheus-petclinic
  retention: 7d
  scrapeInterval: 15s
  evaluationInterval: 15s
  ruleSelector:
    matchLabels:
      app.kubernetes.io/part-of: petclinic
  additionalScrapeConfigs:
    name: prometheus-scrape-config
    key: prometheus-additional.yaml
  alerting:
    alertmanagers:
    - name: alertmanager
      namespace: monitoring
      port: http
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        storageClassName: gp2
        resources:
          requests:
            storage: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    fsGroup: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: prometheus
    prometheus: petclinic
  ports:
  - name: http
    port: 9090
    targetPort: web
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-petclinic
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: backend
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
- nonResourceURLs:
  - /metrics
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-petclinic
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-petclinic
subjects:
- kind: ServiceAccount
  name: prometheus-petclinic
  namespace: monitoring
