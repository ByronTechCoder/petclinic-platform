# Grafana (PETPLAT-56, PETPLAT-57). Datasources are provisioned with pinned
# uids (prometheus, loki) so the dashboard JSON resolves. Every panel target has
# refId and datasource uid (Grafana 10+ requires both). Dashboards are generated
# from a Python builder and embedded below — edit them there, not by hand.
# Admin credentials come from the grafana-admin Secret, which must exist before
# apply: kubectl -n monitoring create secret generic grafana-admin \
#   --from-literal=admin-user=admin --from-literal=admin-password=<choose-one>
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: backend
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n  - name: Prometheus\n    uid: prometheus\n    type: prometheus\n    access: proxy\n    url: http://prometheus:9090\n    isDefault: true\n  - name: Loki\n    uid: loki\n    type: loki\n    access: proxy\n    url: http://loki:3100\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: backend
data:
  provider.yaml: "apiVersion: 1\nproviders:\n  - name: petclinic\n    orgId: 1\n    folder: Petclinic\n    type: file\n    disableDeletion: true\n    options:\n      path: /var/lib/grafana/dashboards\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: backend
