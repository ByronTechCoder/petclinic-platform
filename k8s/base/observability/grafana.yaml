     \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 3,\n      \"title\": \"p95 latency\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 7,\n        \"w\": 12,\n        \"h\": 7\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job=\\\"$service\\\"}[5m])))\",\n          \"editorMode\": \"code\",\n          \"legendFormat\": \"p95\",\n          \"range\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 4,\n      \"title\": \"JVM heap used\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 7,\n        \"w\": 12,\n        \"h\": 7\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(jvm_memory_used_bytes{job=\\\"$service\\\",area=\\\"heap\\\"})\",\n          \"editorMode\": \"code\",\n          \"legendFormat\": \"heap\",\n          \"range\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\"\n        },\n        \"overrides\": []\n      }\n    }\n  ],\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"service\",\n        \"type\": \"custom\",\n        \"label\": \"Service\",\n        \"query\": \"api-gateway,customers-service,visits-service,vets-service,genai-service\",\n        \"current\": {\n          \"text\": \"api-gateway\",\n          \"value\": \"api-gateway\"\n        },\n        \"options\": [\n          {\n            \"text\": \"api-gateway\",\n            \"value\": \"api-gateway\",\n            \"selected\": true\n          },\n          {\n            \"text\": \"customers-service\",\n            \"value\": \"customers-service\",\n            \"selected\": false\n          },\n          {\n            \"text\": \"visits-service\",\n            \"value\": \"visits-service\",\n            \"selected\": false\n          },\n          {\n            \"text\": \"vets-service\",\n            \"value\": \"vets-service\",\n            \"selected\": false\n          },\n          {\n            \"text\": \"genai-service\",\n            \"value\": \"genai-service\",\n            \"selected\": false\n          }\n        ]\n      }\n    ]\n  }\n}"
