": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 6,\n        \"w\": 12,\n        \"h\": 7\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (job) (rate(http_server_requests_seconds_count{status=~\\\"5..\\\"}[5m])) / sum by (job) (rate(http_server_requests_seconds_count[5m]))\",\n          \"editorMode\": \"code\",\n          \"legendFormat\": \"{{job}}\",\n          \"range\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 4,\n      \"title\": \"p95 latency by service\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 6,\n        \"w\": 12,\n        \"h\": 7\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.95, sum by (job, le) (rate(http_server_requests_seconds_bucket[5m])))\",\n          \"editorMode\": \"code\",\n          \"legendFormat\": \"{{job}}\",\n          \"range\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      }\n    }\n  ],\n  \"templating\": {\n    \"list\": []\n  }\n}"
