# API Gateway (PETPLAT-108) — the only public-facing service (fronted by
# k8s/base/ingress/ingress.yaml's ALB, unaffected by this Helm migration —
# Ingress/ExternalSecrets stay Kustomize-managed, only the 8 Deployments+
# friends move to Helm). Higher CPU request/limit than the other services
# since it handles all incoming traffic routing.
#
# replicaCount/autoscaling/podDisruptionBudget below are prod-shaped
# (matching k8s/overlays/prod + hpa.yaml exactly) — helm-values/dev.yaml
# forces them back down uniformly for dev.

image:
  repositorySuffix: api-gateway
  tag: v1.0.0

component: gateway

service:
  port: 8080

configMap:
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin.tracing:9411/api/v2/spans"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  CONFIG_SERVER_URL: "http://config-server:8888"
  DISCOVERY_SERVER_URL: "http://discovery-server:8761"
  # Higher than the chart default (helm/petclinic-service/values.yaml) — this
  # is the only reactive/Netty service and handles all ingress traffic.
  JAVA_TOOL_OPTIONS: "-Xmx192m -Xss256k -XX:MaxMetaspaceSize=112m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC"

initContainers:
  - name: wait-for-config-server
    url: http://config-server:8888/actuator/health
  - name: wait-for-discovery-server
    url: http://discovery-server:8761/actuator/health

resources:
  requests:
    cpu: 200m
    memory: 320Mi # Higher than the chart default (256Mi) to match its heavier JAVA_TOOL_OPTIONS above.
  limits:
    cpu: 1000m
    memory: 512Mi

replicaCount: 2 # prod value (technical-spec.md#kubernetes-overlays, Prod Overlay table)

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1
