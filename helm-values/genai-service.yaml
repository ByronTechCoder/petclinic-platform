# GenAI Service (PETPLAT-108) — includes the `production` profile like
# vets-service. MySQL is optional for this service and not wired here: it
# has JPA + MySQL dependencies but ships no schema files, so there's
# nothing for it to connect to yet (see k8s/base/genai-service/deployment.yaml).
#
# KNOWN ISSUE (deferred, 2026-10-01): despite no SPRING_DATASOURCE_URL being
# set here, this service still crash-loops in practice with
# `Access denied for user 'ubuntu'@...` — it inherits a shared
# spring.datasource property from the upstream Spring Cloud Config repo's
# common `application.yml` profile (config.import: configserver:... pulls
# that in for every service), and Hibernate auto-activates and fails to
# authenticate. This service does NOT need RDS access — the fix should
# EXCLUDE JPA/DataSource autoconfiguration (e.g. a
# spring.autoconfigure.exclude env var for
# HibernateJpaAutoConfiguration/DataSourceAutoConfiguration), not wire real
# RDS credentials like the other three DB-backed services.
#
# Secret reference matches k8s/base/external-secrets/openai-api-key.yaml's
# target exactly: K8s Secret "openai-api-key", key "OPENAI_API_KEY".
#
# replicaCount/autoscaling below are prod-shaped (matching k8s/overlays/prod
# + hpa.yaml exactly) — helm-values/dev.yaml forces them back down
# uniformly for dev. No podDisruptionBudget: genai-service isn't in
# technical-spec.md's PDB table (a minAvailable=1 budget on a 1-replica
# prod service would block all voluntary disruption, e.g. node drains).

image:
  repositorySuffix: genai-service

component: service

service:
  port: 8084

springProfilesActive: docker,production

configMap:
  CONFIG_SERVER_URL: "http://config-server:8888"
  # Higher than the chart default (helm/petclinic-service/values.yaml) — this
  # service has JPA+MySQL on its classpath (see this file's header comment),
  # and Hibernate's bytecode/proxy generation needs more metaspace than
  # non-JPA services; 96m caused a Metaspace OOM crash in practice
  # (2026-10-01 incident, see docs/technical-spec.md#resource-requests-and-limits).
  JAVA_TOOL_OPTIONS: "-Xmx128m -Xss256k -XX:MaxMetaspaceSize=224m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC"

secretEnv:
  - name: OPENAI_API_KEY
    secretName: openai-api-key
    secretKey: OPENAI_API_KEY

initContainers:
  - name: wait-for-config-server
    url: http://config-server:8888/actuator/health
  - name: wait-for-discovery-server
    url: http://discovery-server:8761/actuator/health

resources:
  requests:
    cpu: 100m
    memory: 384Mi # Higher than the chart default (256Mi) to match the JPA-tier JAVA_TOOL_OPTIONS above.
  limits:
    cpu: 500m
    memory: 640Mi

replicaCount: 1 # prod value (technical-spec.md#kubernetes-overlays, Prod Overlay table)

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
